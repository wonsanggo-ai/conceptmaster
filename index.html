<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대구서부고등학교 개념마스터 — DSH 기초역량 개념어 학습 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --dsh-navy: #1B365D;
      --dsh-navy-deep: #0F2C59;
      --dsh-blue: #005596;
      --dsh-blue-soft: #1E56A0;
      --dsh-text: #222222;
      --dsh-muted: #666666;
      --dsh-surface: #F5F7FA;
      --dsh-border: #DCE1E7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: var(--dsh-surface);
      color: var(--dsh-text);
      margin: 0;
      overflow-x: hidden;
    }
    .dsh-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dsh-blue);
    }
    .dsh-rule {
      height: 2px;
      width: 44px;
      background-color: var(--dsh-blue);
      border-radius: 9999px;
    }
    .dsh-callout {
      background-color: #F5F7FA;
      border: 1px solid #DCE1E7;
      border-left: 4px solid #005596;
    }
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      display: grid;
      position: relative;
      width: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped { transform: rotateY(180deg); }
    .flip-face {
      grid-area: 1 / 1;
      min-height: 340px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
    }
    .flip-back { transform: rotateY(180deg); }
    .badge-shine {
      background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 60%);
    }
    .toast-enter { animation: slideUpFade 0.25s ease-out forwards; }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tab-pill { transition: all 0.18s ease; }
    .study-collapsible {
      max-height: 1100px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, margin 0.25s ease;
    }
    .study-collapsible.is-collapsed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .study-chevron {
      transition: transform 0.25s ease;
    }
    .study-chevron.is-open {
      transform: rotate(180deg);
    }
    .card-slide-in {
      animation: cardSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateX(18px) scale(0.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @media (max-width: 767px) {
      #main-header.study-compact-header > div:first-child {
        height: 3rem;
      }
      #main-header.study-compact-header #logo-home-btn img {
        width: 2rem;
        height: 2rem;
      }
      #main-header.study-compact-header #logo-home-btn span.font-extrabold {
        font-size: 0.9rem;
      }
      .flip-face {
        min-height: 360px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#F5F7FA] text-[#222222]">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Reusable Confirm/Preview Modal -->
  <div id="app-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-[#DCE1E7]">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900">안내</h3>
        <button type="button" id="modal-close-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100" aria-label="닫기">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="px-6 py-5 text-sm text-slate-700 max-h-[65vh] overflow-y-auto"></div>
      <div id="modal-footer" class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-2"></div>
    </div>
  </div>

    const STORAGE_KEY = 'concept_master_v1_state';
    const APP_VERSION = 'v1.1.0';
    const GAS_API_URL = 'https://script.google.com/a/macros/seobu.hs.kr/s/AKfycbxvMliQe_ggxRd6GAU873yLRywEeqLB0U6BcRUWL-qb62dpMpRjDXS6XZsPavlFhkihcg/exec';
    const IS_GAS_IFRAME = (typeof google !== 'undefined' && google.script && google.script.run);
    const IS_GAS = IS_GAS_IFRAME || Boolean(GAS_API_URL);

    function forceHardReload() {
      showToast('캐시를 비우고 최신 버전을 불러오는 중...', 'info');
      const doNavigate = () => {
        try {
          if (IS_GAS_IFRAME) {
            window.location.reload();
            return;
          }
          const url = new URL(window.location.href);
          url.searchParams.set('v', String(Date.now()));
          window.location.replace(url.toString());
        } catch (e) {
          window.location.reload();
        }
      };
      if (window.caches && typeof window.caches.keys === 'function') {
        window.caches.keys()
          .then(keys => Promise.all(keys.map(k => window.caches.delete(k))))
          .catch(() => {})
          .finally(doNavigate);
      } else {
        setTimeout(doNavigate, 150);
      }
    }

    function callGas(fnName, ...args) {
      if (IS_GAS_IFRAME) {
        return new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
        });
      }
      if (!GAS_API_URL) {
        return Promise.reject(new Error('NOT_GAS'));
      }
      return fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fnName, args: args })
      }).then(async (res) => {
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Apps Script Code.gs에 최신 JSON API 코드를 반영한 뒤 [배포 관리 > 새 버전]으로 배포해 주세요.');
        }
        if (!data || data.ok === false) {
          throw new Error((data && data.error) || '서버 처리 중 오류가 발생했습니다.');
        }
        return data.result;
      });
    }

    function applyBootstrap(data) {
      if (!data) return;
      if (Array.isArray(data.subjects)) state.subjects = data.subjects;
      if (Array.isArray(data.students)) state.students = data.students;
      if (data.settings) state.settings = Object.assign({}, state.settings, data.settings);
      if (state.subjects.length > 0 && !state.subjects.some(s => s.id === state.activeSubjectId)) {
        state.activeSubjectId = state.subjects[0].id;
      }
      if (state.subjects.length > 0 && !state.subjects.some(s => s.id === state.rankingSubjectId)) {
        state.rankingSubjectId = state.subjects[0].id;
      }
      // Re-validate restored sessionStorage student against fresh master DB
      const savedSession = safeSessionGet(SESSION_KEY);
      if (!state.session && savedSession && savedSession.role === 'student' && state.students.some(s => s.id === savedSession.studentId)) {
        state.session = savedSession;
        const savedView = safeSessionGet(LAST_VIEW_KEY);
        const sScreen = (savedView && savedView.screen && savedView.screen !== 'login') ? savedView.screen : 'subjects';
        const sParams = (savedView && savedView.params) ? savedView.params : {};
        applyScreenParams(sScreen, sParams);
      }
      if (state.session && state.session.role === 'admin' && state.teacherPrefs && state.teacherPrefs.configured) {
        if (state.teacherDashSubjectFilter === 'all' && state.teacherPrefs.subjectId && state.teacherPrefs.subjectId !== 'all') {
          if (state.teacherPrefs.subjectId === 'IB' || state.subjects.some(s => s.id === state.teacherPrefs.subjectId)) {
            state.teacherDashSubjectFilter = state.teacherPrefs.subjectId;
          }
        }
      }
    }

    async function syncFromServer(showNotice) {
      if (!IS_GAS) return;
      try {
        const data = await callGas('getBootstrapData');
        applyBootstrap(data);
        if (showNotice) showToast('마스터 구글 스프레드시트에서 최신 데이터를 불러왔습니다.', 'success');
        renderApp();
      } catch (err) {
        showToast('스프레드시트 동기화 오류: ' + (err && err.message ? err.message : err), 'error');
      }
    }

    function isIbText(str) {
      const s = String(str || '').toUpperCase();
      return s.includes('IB') || s.includes('TOK') || s.includes('CAS') ||
        s.includes('DP') || s.includes('지식이론') || s.includes('소논문');
    }

    function isIbSubject(subj) {
      if (!subj) return false;
      return Boolean(subj.isIB) || String(subj.grade || '').toUpperCase() === 'IB' ||
        subj.category === 'IB' || isIbText(subj.name);
    }

    function formatGradeLabel(grade) {
      if (String(grade || '').toUpperCase() === 'IB') return 'IB';
      return String(grade) + '학년';
    }

    function parseConceptGrade(raw, subjectName) {
      const s = String(raw == null ? '' : raw).trim();
      if (/ib|dp/i.test(s)) return 'IB';
      const m = s.match(/[1-3]/);
      if (m) return Number(m[0]);
      if (isIbText(subjectName)) return 'IB';
      return 1;
    }

    function getCategoryForSubject(name, gradeVal) {
      const s = String(name || '');
      if (isIbText(s) || String(gradeVal || '').toUpperCase() === 'IB') return 'IB';
      if (s.includes('국어') || s.includes('문학') || s.includes('화법')) return '국어';
      if (s.includes('수학') || s.includes('기하') || s.includes('미적분')) return '수학';
      if (s.includes('영어')) return '영어';
      if (s.includes('한국사') || s.includes('역사')) return '역사';
      if (s.includes('사회') || s.includes('지리') || s.includes('윤리') || s.includes('경제')) return '사회';
      if (s.includes('과학') || s.includes('물리') || s.includes('화학') || s.includes('생명') || s.includes('지구')) return '과학';
      return '기타';
    }

    function clearStudyAutoNextTimer() {
      if (studyAutoNextTimer) {
        clearTimeout(studyAutoNextTimer);
        studyAutoNextTimer = null;
      }
      if (studyAutoNextInterval) {
        clearInterval(studyAutoNextInterval);
        studyAutoNextInterval = null;
      }
      studyAutoNextPaused = false;
      studyAutoNextRemainingMs = 0;
      const area = document.getElementById('auto-next-area');
      const hint = document.getElementById('card-back-default-hint');
      if (area) area.classList.add('hidden');
      if (hint) hint.classList.remove('hidden');

    function advanceToNextStudyCard(isAuto) {
      clearStudyAutoNextTimer();
      const stu = getCurrentStudent();
      const subj = getSubjectById(state.activeSubjectId);
      if (!stu || !subj) return;
      const filtered = getFilteredStudyConcepts(subj, stu);
      if (filtered.length === 0) return;
      const wasLast = state.studyCardIndex === filtered.length - 1;
      state.studyCardIndex = (state.studyCardIndex + 1) % filtered.length;
      state.studyCardFlipped = false;
      state.studyCardJustAdvanced = true;
      if (isAuto && wasLast && filtered.length > 1) {
        showToast('마지막 단어까지 확인했습니다. 처음 단어로 돌아갑니다.', 'info');
      }
      renderApp();
      state.studyCardJustAdvanced = false;
    }

    function updateAutoNextCountdownUi() {
      const label = document.getElementById('auto-next-label');
      const pauseBtn = document.getElementById('auto-next-pause-btn');
      if (!label) return;
      if (studyAutoNextPaused) {
        const secs = Math.max(1, Math.ceil(studyAutoNextRemainingMs / 1000));
        label.textContent = '일시정지됨 (' + secs + '초 남음)';
        if (pauseBtn) pauseBtn.textContent = '계속';
      } else {
        const elapsed = Date.now() - studyAutoNextStartedAt;
        const left = Math.max(0, studyAutoNextRemainingMs - elapsed);
        const secs = Math.max(1, Math.ceil(left / 1000));
        label.textContent = secs + '초 후 다음 단어로 자동 이동';
        if (pauseBtn) pauseBtn.textContent = '일시정지';
      }
    }

    function startStudyAutoNextTimer(cardCount, customDurationMs) {
      clearStudyAutoNextTimer();
      if (!state.studyAutoNext || cardCount <= 1) return;
      const area = document.getElementById('auto-next-area');
      const hint = document.getElementById('card-back-default-hint');
      const bar = document.getElementById('auto-next-progress');
      if (!area || !bar) return;

      const totalMs = Math.max(1000, Number(state.studyAutoNextDelay || 3) * 1000);
      const runMs = typeof customDurationMs === 'number' ? customDurationMs : totalMs;
      studyAutoNextTotalMs = totalMs;
      studyAutoNextRemainingMs = runMs;
      studyAutoNextStartedAt = Date.now();
      studyAutoNextPaused = false;

      area.classList.remove('hidden');
      if (hint) hint.classList.add('hidden');

      const startPct = Math.min(100, Math.max(0, (runMs / totalMs) * 100));
      bar.style.transition = 'none';
      bar.style.width = startPct + '%';
      void bar.offsetWidth;
      bar.style.transition = 'width ' + runMs + 'ms linear';
      bar.style.width = '0%';

      updateAutoNextCountdownUi();
      studyAutoNextInterval = setInterval(updateAutoNextCountdownUi, 150);
      studyAutoNextTimer = setTimeout(() => {
        advanceToNextStudyCard(true);
      }, runMs);
    }

    function togglePauseStudyAutoNext(cardCount) {
      const bar = document.getElementById('auto-next-progress');
      if (!studyAutoNextPaused) {
        const elapsed = Date.now() - studyAutoNextStartedAt;
        studyAutoNextRemainingMs = Math.max(0, studyAutoNextRemainingMs - elapsed);
        if (studyAutoNextTimer) { clearTimeout(studyAutoNextTimer); studyAutoNextTimer = null; }
        if (studyAutoNextInterval) { clearInterval(studyAutoNextInterval); studyAutoNextInterval = null; }
        studyAutoNextPaused = true;
        if (bar) {
          const pct = Math.min(100, Math.max(0, (studyAutoNextRemainingMs / studyAutoNextTotalMs) * 100));
          bar.style.transition = 'none';
          bar.style.width = pct + '%';
        }
        updateAutoNextCountdownUi();
      } else {
        if (studyAutoNextRemainingMs <= 120) {
          advanceToNextStudyCard(true);
          return;
        }
        startStudyAutoNextTimer(cardCount, studyAutoNextRemainingMs);
      }
    }

      }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          subjects: state.subjects,
          students: state.students,

    // =========================================================================
    // 2-1. HISTORY & SESSION ROUTER (새로고침 로그인 유지 + 뒤로가기 지원)
    // =========================================================================
    const SESSION_KEY = 'dsh_cm_session';
    const LAST_VIEW_KEY = 'dsh_cm_lastView';

    function safeSessionGet(key) {
      try { return JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) { return null; }
    }
    function safeSessionSet(key, val) {
      try { sessionStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }
    function safeSessionRemove(key) {
      try { sessionStorage.removeItem(key); } catch (e) {}
    }

    const appState = {
      screen: 'login',
      params: {}
    };

    function applyScreenParams(screen, params) {
      const p = params || {};
      const prevScreen = appState.screen;
      clearStudyAutoNextTimer();
      appState.screen = screen;
      appState.params = p;

      if (p.subjectId && p.subjectId !== state.activeSubjectId) {
        state.activeSubjectId = p.subjectId;
        state.studyUnitFilter = 'all';
        state.studyCardIndex = 0;
        state.studyCardFlipped = false;
      } else if (p.subjectId) {
        state.activeSubjectId = p.subjectId;
      }
      if (p.studyUnit) state.studyUnitFilter = p.studyUnit;
      if (p.rankingMode) state.rankingMode = p.rankingMode;
      if (p.rankingGradeTab) state.rankingGradeTab = p.rankingGradeTab;
      if (p.rankingSubjectId) state.rankingSubjectId = p.rankingSubjectId;
      if (p.quizPhase) state.quizPhase = p.quizPhase;

      if (screen === 'study' && prevScreen !== 'study') {
        state.studyHeaderCollapsed = isMobileViewport() && state.studyAutoCollapse;
      }

      if (screen === 'subjects' || screen === 'study' || screen === 'quiz' || screen === 'ranking') {
        state.studentTab = screen;
      } else if (screen === 'admin-dashboard') {
        state.adminTab = 'dashboard';
      } else if (screen === 'admin-resources') {
        state.adminTab = 'resources';
      } else if (screen === 'admin-students') {
        state.adminTab = 'students';
      } else if (screen === 'admin-stats') {
        state.adminTab = 'stats';
      }
    }

    function navigateTo(screen, params = {}, pushHistory = true) {
      if (!state.session && screen !== 'login') {
        screen = 'login';
        params = {};
      }
      applyScreenParams(screen, params);
      safeSessionSet(LAST_VIEW_KEY, { screen, params: appState.params });

      if (pushHistory) {
        try {
          history.pushState({ screen, params: appState.params }, '', '#' + screen);
        } catch (e) {}
      }
      renderScreen(screen, appState.params);
    }

    function renderScreen(screen, params) {
      applyScreenParams(screen, params);
      renderApp();
      try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) {}
    }

    function onLoginSuccess(sessionObj) {
      state.session = sessionObj;
      safeSessionSet(SESSION_KEY, sessionObj);
      if (sessionObj.role === 'student') {
        const stu = state.students.find(s => s.id === sessionObj.studentId);
        if (stu) state.rankingGradeTab = String(stu.grade);
        navigateTo('subjects', {}, true);
      } else {
        applyTeacherDefaultFilters();
        navigateTo('admin-dashboard', {}, true);
        if (!state.teacherPrefs.configured && !state.teacherPromptedSetup) {
          state.teacherPromptedSetup = true;
          setTimeout(() => {
            if (state.session && state.session.role === 'admin') openTeacherPrefsModal();
          }, 150);
        }
      }
    }

    function onLogout() {
      state.session = null;
      state.quizPhase = 'setup';
      safeSessionRemove(SESSION_KEY);
      safeSessionRemove(LAST_VIEW_KEY);
      showToast('로그아웃되었습니다.');
      navigateTo('login', {}, true);
    }

    window.addEventListener('popstate', (event) => {
      if (event.state && event.state.screen) {
        if (!state.session && event.state.screen !== 'login') {
          navigateTo('login', {}, false);
          return;
        }
        navigateTo(event.state.screen, event.state.params || {}, false);
      } else {
        const fallback = state.session
          ? (state.session.role === 'admin' ? 'admin-dashboard' : 'subjects')
          : 'login';
        navigateTo(fallback, {}, false);
      }
    });

    function getCurrentStudent() {
      if (!state.session || state.session.role !== 'student') return null;
      return state.students.find(s => s.id === state.session.studentId) || null;
    }

    function getSubjectById(id) {
      return state.subjects.find(s => s.id === id) || state.subjects[0] || null;
    }

    // =========================================================================
    // 3. UTILITIES (Toast, Modal, CSV/TSV Parser, Download, Clipboard)
    // =========================================================================
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-[#1B365D] text-white'
      };
      const el = document.createElement('div');
      el.className = ("toast-enter pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 " + (colors[type] || colors.info));
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    function openModal(title, bodyHtml, buttons = []) {
      const modal = document.getElementById('app-modal');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const footer = document.getElementById('modal-footer');
      footer.innerHTML = '';
      if (buttons.length === 0) {
        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'px-4 py-2 rounded-xl text-sm font-semibold bg-[#1B365D] text-white hover:bg-slate-800';
        closeBtn.textContent = '확인';
        closeBtn.addEventListener('click', closeModal);
        footer.appendChild(closeBtn);
      } else {
        buttons.forEach(btn => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = btn.className || 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-200 text-slate-800 hover:bg-slate-300';
          b.textContent = btn.label;
          b.addEventListener('click', () => {
            if (btn.onClick) btn.onClick();
            if (btn.closeOnClick !== false) closeModal();
          });
          footer.appendChild(b);
        });
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      refreshIcons();
    }

    function closeModal() {
      const modal = document.getElementById('app-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function copyTextToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg || '클립보드에 복사되었습니다.', 'success');
        }).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg || '클립보드에 복사되었습니다.', 'success');
      } catch (e) {
        showToast('복사에 실패했습니다. 직접 선택하여 복사해 주세요.', 'error');
      }
      ta.remove();
    }

    function downloadCsvFile(filename, rows) {
      const csvContent = rows.map(row =>
        row.map(cell => {
          const s = String(cell == null ? '' : cell);
          return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',')
      ).join('\r\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(((filename) + " 템플릿이 다운로드되었습니다."), 'success');
    }

    // Robust CSV/TSV parser supporting quoted fields and Google Sheets copy-paste (tabs)
    function parseDelimitedText(text) {
      const clean = (text || '').replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const firstLine = clean.split(/\r?\n/)[0] || '';
      const delimiter = firstLine.includes('\t') ? '\t' : ',';
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        const next = clean[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === delimiter) {
            row.push(field.trim());
            field = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        rows.push(row);
      }
      return rows.filter(r => r.some(cell => cell !== ''));
    }

    function normalizeGoogleSheetCsvUrl(rawUrl) {
      const url = (rawUrl || '').trim();
      if (!url) return '';
      // Already a published CSV link
      if (url.includes('output=csv') || url.includes('format=csv')) return url;
      // Standard Google Sheets edit/view link -> convert to export?format=csv
      const match = url.match(/docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match) {
        const gidMatch = url.match(/gid=(\d+)/);
        const gidPart = gidMatch ? ("&gid=" + (gidMatch[1])) : '';
        return ("https://docs.google.com/spreadsheets/d/" + (match[1]) + "/export?format=csv" + (gidPart));
      }
      return url;
    }

    function getStudentAverageScore(student) {
      if (!student.quizHistory || student.quizHistory.length === 0) return 0;
      const sum = student.quizHistory.reduce((acc, q) => acc + Number(q.score || 0), 0);
      return Math.round(sum / student.quizHistory.length);
    }

    function getRankedStudents(gradeFilter) {
      const list = state.students.filter(s => gradeFilter === 'all' ? true : String(s.grade) === String(gradeFilter));
      return list.slice().sort((a, b) => {
        const badgeDiff = (b.badges ? b.badges.length : 0) - (a.badges ? a.badges.length : 0);
        if (badgeDiff !== 0) return badgeDiff;
        const avgDiff = getStudentAverageScore(b) - getStudentAverageScore(a);
        if (avgDiff !== 0) return avgDiff;
        return a.name.localeCompare(b.name, 'ko');
      });
    }

    function getStudentRankInGrade(student) {
      const ranked = getRankedStudents(String(student.grade));
      const idx = ranked.findIndex(s => s.id === student.id);
      return { rank: idx >= 0 ? idx + 1 : ranked.length, total: ranked.length };
    }

    function getSubjectRankedStudents(subjectId, gradeFilter) {
      const subj = getSubjectById(subjectId);
      if (!subj) return [];
      const list = state.students.filter(s => gradeFilter === 'all' ? true : String(s.grade) === String(gradeFilter));
      const entries = [];
      list.forEach(s => {
        const hist = (s.quizHistory || []).filter(q => q.subjectId === subj.id || q.subjectName === subj.name);
        const badge = (s.badges || []).find(b => b.subjectId === subj.id || b.subjectName === subj.name);
        const memCount = subj.concepts.filter(c => (s.memorized || []).includes(c.id)).length;
        if (hist.length === 0 && !badge) return;
        const bestScore = Math.max(
          badge ? Number(badge.score || 0) : 0,
          hist.reduce((mx, q) => Math.max(mx, Number(q.score || 0)), 0)
        );
        const lastDate = hist.length > 0 ? hist[hist.length - 1].date : (badge ? badge.date : '');
        entries.push({
          student: s,
          bestScore,
          badge,
          attempts: hist.length || (badge ? 1 : 0),
          memCount,
          totalConcepts: subj.concepts.length,
          lastDate
        });
      });
      return entries.sort((a, b) => {
        if (b.bestScore !== a.bestScore) return b.bestScore - a.bestScore;
        if (b.memCount !== a.memCount) return b.memCount - a.memCount;
        return a.student.name.localeCompare(b.student.name, 'ko');
      });
    }

    function getConceptUnitName(c) {
      return (c && c.unit && String(c.unit).trim()) ? String(c.unit).trim() : '핵심 단원';
    }

    function getSubjectUnits(subj, stu) {
      const unitMap = new Map();
      (subj && subj.concepts ? subj.concepts : []).forEach(c => {
        const uName = getConceptUnitName(c);
        if (!unitMap.has(uName)) {
          unitMap.set(uName, { name: uName, total: 0, memorized: 0 });
        }
        const entry = unitMap.get(uName);
        entry.total += 1;
        if (stu && stu.memorized.includes(c.id)) {
          entry.memorized += 1;
        }
      });
      return Array.from(unitMap.values());
    }

    function getFilteredStudyConcepts(subj, stu) {
      if (!subj || !Array.isArray(subj.concepts)) return [];
      const unitScoped = state.studyUnitFilter === 'all'
        ? subj.concepts
        : subj.concepts.filter(c => getConceptUnitName(c) === state.studyUnitFilter);
      return state.studyOnlyUnmemorized
        ? unitScoped.filter(c => !stu.memorized.includes(c.id))
        : unitScoped;
    }

    function renderStudentStudyView(stu) {
      const subj = getSubjectById(state.activeSubjectId);
      if (!subj) return "\x3cdiv class=\"p-8 text-center text-slate-500\"\x3e등록된 과목이 없습니다.\x3c/div\x3e";
      const style = SUBJECT_STYLES[subj.category] || SUBJECT_STYLES['기타'];
      const units = getSubjectUnits(subj, stu);
      if (state.studyUnitFilter !== 'all' && !units.some(u => u.name === state.studyUnitFilter)) {
        state.studyUnitFilter = 'all';
      }
      const unitScoped = state.studyUnitFilter === 'all'
        ? subj.concepts
        : subj.concepts.filter(c => getConceptUnitName(c) === state.studyUnitFilter);
      const filtered = getFilteredStudyConcepts(subj, stu);
      if (state.studyCardIndex >= filtered.length) state.studyCardIndex = 0;
      const current = filtered[state.studyCardIndex];
      const memCount = subj.concepts.filter(c => stu.memorized.includes(c.id)).length;
      const scopeMemCount = unitScoped.filter(c => stu.memorized.includes(c.id)).length;
      const scopeTotalCount = unitScoped.length;
      const scopePct = scopeTotalCount > 0 ? Math.round((scopeMemCount / scopeTotalCount) * 100) : 0;
      const currentUnitIdx = units.findIndex(u => u.name === state.studyUnitFilter);
      const nextUnfinishedUnit = units.find((u, idx) => idx !== currentUnitIdx && u.memorized < u.total)
        || (currentUnitIdx >= 0 && currentUnitIdx + 1 < units.length ? units[currentUnitIdx + 1] : null);

    function startQuiz(subjectId) {
      const subj = getSubjectById(subjectId);
      if (!subj || subj.concepts.length < 2) {
        showToast('테스트를 진행하려면 과목에 최소 2개 이상의 개념어가 필요합니다.', 'warning');
        return;
      }
      const pool = subj.concepts.slice().sort(() => Math.random() - 0.5);
      const count = state.quizCount === '5' ? Math.min(5, pool.length) : pool.length;
      const chosen = pool.slice(0, count);

      state.quizQuestions = chosen.map((c, idx) => {
        const distractors = subj.concepts
          .filter(other => other.id !== c.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        // Alternate question direction in multiple choice
        const askTerm = state.quizType === 'short' ? true : (idx % 2 === 0);
        const options = askTerm
          ? [c.term, ...distractors.map(d => d.term)].sort(() => Math.random() - 0.5)
          : [c.definition, ...distractors.map(d => d.definition)].sort(() => Math.random() - 0.5);
        return {
          concept: c,
          askTerm,
          prompt: askTerm ? c.definition : c.term,
          correctAnswer: askTerm ? c.term : c.definition,
          options
        };
      });
      state.quizCurrentIndex = 0;
      state.quizAnswers = [];
      state.quizSelectedOption = null;
      state.quizSubmittedCurrent = false;
      state.quizPhase = 'active';
      renderApp();
    }

        ? subjRanked.findIndex(e => e.student.id === stu.id)

      if (subjectFilter === 'IB') {
        scopedSubjects = state.subjects.filter(s => isIbSubject(s));
      } else if (subjectFilter !== 'all') {
        const picked = getSubjectById(subjectFilter);
        scopedSubjects = picked ? [picked] : state.subjects.slice();
      } else if (gradeFilter !== 'all') {
        const byGrade = state.subjects.filter(s => String(s.grade) === String(gradeFilter) || isIbSubject(s));
        scopedSubjects = byGrade.length > 0 ? byGrade : state.subjects.slice();
      }

      const scopedConceptIds = new Set();
      const scopedSubjectIds = new Set();
      const scopedSubjectNames = new Set();
      scopedSubjects.forEach(subj => {
        scopedSubjectIds.add(subj.id);
        scopedSubjectNames.add(subj.name);
        (subj.concepts || []).forEach(c => scopedConceptIds.add(c.id));
      });
      const totalConcepts = scopedConceptIds.size;
      const totalUnits = scopedSubjects.reduce((acc, subj) => acc + getSubjectUnits(subj, null).length, 0);

      const getStudentScopedMemCount = (s) => (s.memorized || []).filter(cid => scopedConceptIds.has(cid)).length;
      const getStudentScopedQuizzes = (s) => (s.quizHistory || []).filter(q => {
        if (subjectFilter === 'all') return true;
        return scopedSubjectIds.has(q.subjectId) || scopedSubjectNames.has(q.subjectName);
      });
      const getStudentScopedBadges = (s) => (s.badges || []).filter(b => {
        if (subjectFilter === 'all') return true;
        return scopedSubjectIds.has(b.subjectId) || scopedSubjectNames.has(b.subjectName);
      });

      const activeStudents = scopedStudents.filter(s => getStudentScopedMemCount(s) > 0 || getStudentScopedQuizzes(s).length > 0);
      const participationPct = scopedStudents.length > 0 ? Math.round((activeStudents.length / scopedStudents.length) * 100) : 0;
      const totalBadges = scopedStudents.reduce((acc, s) => acc + getStudentScopedBadges(s).length, 0);

      const avgMemPct = (scopedStudents.length > 0 && totalConcepts > 0)
        ? Math.round(scopedStudents.reduce((acc, s) => acc + (getStudentScopedMemCount(s) / totalConcepts) * 100, 0) / scopedStudents.length)
        : 0;

      const allQuizzes = [];
      scopedStudents.forEach(s => {
        getStudentScopedQuizzes(s).forEach(q => {
          allQuizzes.push({
            studentId: s.id,
            studentName: s.name,
            grade: s.grade,
            classNum: s.classNum,
            subjectName: q.subjectName || (getSubjectById(q.subjectId) ? getSubjectById(q.subjectId).name : '과목'),
            score: Number(q.score) || 0,
            date: String(q.date || '')
          });
        });
      });
      const avgScore = allQuizzes.length > 0
        ? Math.round(allQuizzes.reduce((acc, q) => acc + q.score, 0) / allQuizzes.length)
        : 0;
      const passedCount = allQuizzes.filter(q => q.score >= state.settings.passThreshold).length;
      const passRate = allQuizzes.length > 0 ? Math.round((passedCount / allQuizzes.length) * 100) : 0;

      // Selected single subject unit breakdown
      const singleSubject = (subjectFilter !== 'all' && subjectFilter !== 'IB' && scopedSubjects.length === 1) ? scopedSubjects[0] : null;
      const singleSubjectUnits = singleSubject ? getSubjectUnits(singleSubject, null).map(u => {
        const uConceptIds = new Set((singleSubject.concepts || []).filter(c => getConceptUnitName(c) === u.name).map(c => c.id));
        const avgUnitPct = (scopedStudents.length > 0 && uConceptIds.size > 0)
          ? Math.round(scopedStudents.reduce((acc, s) => {
              const m = (s.memorized || []).filter(cid => uConceptIds.has(cid)).length;
              return acc + (m / uConceptIds.size) * 100;
            }, 0) / scopedStudents.length)
          : 0;
        const completedStudents = scopedStudents.filter(s => {
          const m = (s.memorized || []).filter(cid => uConceptIds.has(cid)).length;
          return uConceptIds.size > 0 && m === uConceptIds.size;
        }).length;
        return { name: u.name, total: u.total, avgUnitPct, completedStudents };
      }) : [];

      // Class-level aggregation
      const classMap = new Map();
      scopedStudents.forEach(s => {
        const key = String(s.grade) + '-' + String(s.classNum);
        if (!classMap.has(key)) {
          classMap.set(key, { grade: Number(s.grade) || 1, classNum: Number(s.classNum) || 1, students: [] });
        }
        classMap.get(key).students.push(s);
      });
      const classStats = Array.from(classMap.values())
        .sort((a, b) => (a.grade - b.grade) || (a.classNum - b.classNum))
        .map(cls => {
          const cnt = cls.students.length;
          const active = cls.students.filter(s => getStudentScopedMemCount(s) > 0 || getStudentScopedQuizzes(s).length > 0).length;
          const cBadges = cls.students.reduce((acc, s) => acc + getStudentScopedBadges(s).length, 0);
          const cMemPct = (cnt > 0 && totalConcepts > 0)
            ? Math.round(cls.students.reduce((acc, s) => acc + (getStudentScopedMemCount(s) / totalConcepts) * 100, 0) / cnt)
            : 0;
          const clsQuizzes = [];
          cls.students.forEach(s => getStudentScopedQuizzes(s).forEach(q => clsQuizzes.push(Number(q.score) || 0)));
          const cAvgScore = clsQuizzes.length > 0
            ? Math.round(clsQuizzes.reduce((acc, sc) => acc + sc, 0) / clsQuizzes.length)
            : 0;
          return {
            grade: cls.grade,
            classNum: cls.classNum,
            total: cnt,
            active,
            inactive: cnt - active,
            avgMemPct: cMemPct,
            totalBadges: cBadges,
            avgScore: cAvgScore
          };
        });

      // Individual student rows (shown prominently when a specific class is selected)
      const classDetailStudents = scopedStudents.slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).map(s => {
        const mCnt = getStudentScopedMemCount(s);
        const mPct = totalConcepts > 0 ? Math.round((mCnt / totalConcepts) * 100) : 0;
        const qList = getStudentScopedQuizzes(s);
        const qAvg = qList.length > 0 ? Math.round(qList.reduce((acc, q) => acc + (Number(q.score) || 0), 0) / qList.length) : 0;
        const qBest = qList.length > 0 ? Math.max(...qList.map(q => Number(q.score) || 0)) : 0;
        const bList = getStudentScopedBadges(s);
        return { student: s, mCnt, mPct, qCount: qList.length, qAvg, qBest, badgeCount: bList.length };
      });

      // Subject-level aggregation
      const subjectStats = scopedSubjects.map(subj => {
        const cIds = new Set((subj.concepts || []).map(c => c.id));
        const unitCount = getSubjectUnits(subj, null).length;
        const avgSubjMem = (scopedStudents.length > 0 && cIds.size > 0)
          ? Math.round(scopedStudents.reduce((acc, s) => {
              const m = (s.memorized || []).filter(cid => cIds.has(cid)).length;

        const subjQuizzes = allQuizzes.filter(q => q.subjectName === subj.name);

          ? Math.round(subjQuizzes.reduce((acc, q) => acc + q.score, 0) / subjQuizzes.length)
          : 0;
        const badgeHolders = scopedStudents.filter(s =>
          (s.badges || []).some(b => b.subjectId === subj.id || b.subjectName === subj.name)

        return {
          id: subj.id,
          name: subj.name,
          grade: subj.grade,
          category: subj.category,
          unitCount,
          conceptCount: cIds.size,
          avgMemPct: avgSubjMem,

          badgeHolders

          return aScore - bScore;
        })
        .filter(s => getStudentScopedBadges(s).length === 0 || getStudentScopedMemCount(s) === 0)
        .slice(0, 10);

      // Recent quiz activity
      const recentQuizzes = allQuizzes
        .slice()
        .sort((a, b) => String(b.date).localeCompare(String(a.date)))
        .slice(0, 10);

      const curSummary = getTeacherFilterSummary(gradeFilter, classFilter, subjectFilter);
      const savedPrefs = state.teacherPrefs || { configured: false, grade: 'all', classNum: 'all', subjectId: 'all' };

      const isViewingAll = gradeFilter === 'all' && classFilter === 'all' && subjectFilter === 'all';
      const isViewingSaved = savedPrefs.grade === gradeFilter && savedPrefs.classNum === classFilter && savedPrefs.subjectId === subjectFilter;

utton type=\"button\" id=\"dash-save-default-btn\" class=\"px-3 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-bold\"\x3e★ 현재 선택을 기본 필터로 저장\x3c/button\x3e\n              \x3c/div\x3e\n            \x3c/div\x3e\n            \x3cdiv class=\"grid grid-cols-1 sm:grid-cols-3 gap-3\"\x3e\n              \x3cdiv\x3e\n                \x3clabel for=\"dash-grade-select\" class=\"block text-[11px] font-bold text-slate-500 mb-1\"\x3e학년\x3c/label\x3e\n                \x3cselect id=\"dash-grade-select\" class=\"w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500\"\x3e\n                  \x3coption value=\"all\" " + (gradeFilter === 'all' ? 'selected' : '') + "\x3e전교 전체\x3c/option\x3e\n                  \x3coption value=\"1\" " + (gradeFilter === '1' ? 'selected' : '') + "\x3e1학년\x3c/option\x3e\n                  \x3coption value=\"2\" " + (gradeFilter === '2' ? 'selected' : '') + "\x3e2학년\x3c/option\x3e\n                  \x3coption value=\"3\" " + (gradeFilter === '3' ? 'selected' : '') + "\x3e3학년\x3c/option\x3e\n                \x3c/select\x3e\n              \x3c/div\x3e\n              \x3cdiv\x3e\n                \x3clabel for=\"dash-class-select\" class=\"block text-[11px] font-bold text-slate-500 mb-1\"\x3e반\x3c/label\x3e\n                \x3cselect id=\"dash-class-select\" class=\"w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500\"\x3e\n                  \x3coption value=\"all\" " + (classFilter === 'all' ? 'selected' : '') + "\x3e전체 반\x3c/option\x3e\n                  " + (availClasses.map(cn => ("\x3coption value=\"" + cn + "\" " + (String(classFilter) === String(cn) ? 'selected' : '') + "\x3e" + cn + "반\x3c/option\x3e")).join('')) + "\n                \x3c/select\x3e\n              \x3c/div\x3e\n              \x3cdiv\               }).join('')) + "\n            \x3c/div\x3e\n          \x3c/section\x3e\n\n          \x3csection class=\"grid grid-cols-1 lg:grid-cols-2 gap-6\"\x3e\n            \x3cdiv class=\"bg-white rounded-2xl border border-[#DCE1E7] shadow-xs overflow-hidden\"\x3e\n              \x3cdiv class=\"px-5 py-4 border-b border-slate-100 flex items-center justify-between\"\x3e\n                \x3cdiv\x3e\n                  \x3ch2 class=\"text-base font-extrabold text-[#1B365D]\"\x3e학습 독려 필요 학생\x3c/h2\x3e\n                  \x3cp class=\"text-xs text-slate-500\"\x3e선택 범위 기준 미암기 또는 뱃지 미획득 학생 (최대 10명)\x3c/p\x3e\n                \x3c/div\x3e\n                \x3cspan class=\"px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 text-xs font-bold\"\x3e" + (needsAttention.length) + "명\x3c/span\x3e\n              \x3c/div\x3e\n              \x3cdiv class=\"divide-y divide-slate-100\"\x3e\n                " + (needsAttention.length === 0 ? "\x3cdiv class=\"p-8 text-center text-sm text-emerald-700 font-semibold\"\x3e선택 범위의 모든 학생이 학습에 참여하고 뱃지를 획득했습니다! 🎉\x3c/div\x3e" : needsAttention.map(s => ("\n                  \x3cdiv class=\"px-5 py-3 flex items-center justify-between gap-2 text-xs hover:bg-slate-50\"\x3e\n                    \x3cdiv\x3e\n                      \x3cspan class=\"font-extrabold text-slate-900\"\x3e" + (escapeHtml(s.name)) + "\x3c/span\x3e\n                      \x3cspan class=\"text-slate-500 ml-1.5\"\x3e" + (s.grade) + "학년 " + (s.classNum) + "반 · " + (escapeHtml(s.id)) + "\x3c/span\x3e\n                    \x3c/div\x3e\n                    \x3cdiv class=\"flex items-center gap-2\"\x3e\n                      \x3cspan class=\"px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold\"\x3e암기 " + (getStudentScopedMemCount(s)) + "개\x3c/span\x3e\n                      \x3cspan class=\"px-2 py-0.5 rounded bg-rose-50 text-rose-700 font-bold\"\x3e뱃지 " + (getStudentScopedBadges(s).length) + "개\x3c/span\x3e\n                    \x3c/div\x3e\n                  \x3c/div\x     function initAdminCharts() {
      if (chartInstances.gradeChart) { chartInstances.gradeChart.destroy(); chartInstances.gradeChart = null; }
      if (chartInstances.subjectChart) { chartInstances.subjectChart.destroy(); chartInstances.subjectChart = null; }
      if (!window.Chart) return;

      const gradeCtx = document.getElementById('admin-grade-chart');
      if (gradeCtx) {
        const avgs = [1, 2, 3].map(g => {
          const list = state.students.filter(s => Number(s.grade) === g);
          if (list.length === 0) return 0;
          return Number((list.reduce((sum, s) => sum + s.badges.length, 0) / list.length).toFixed(2));
        });
        chartInstances.gradeChart = new Chart(gradeCtx, {
          type: 'bar',
          data: {
            labels: ['1학년', '2학년', '3학년'],
            datasets: [{
              label: '평균 뱃지 수',
              data: avgs,
              backgroundColor: ['#1B365D', '#005596', '#2B6CB0'],
              borderRadius: 10
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }

      const subjCtx = document.getElementById('admin-subject-chart');
      if (subjCtx) {
        const labels = state.subjects.map(s => s.name);

    // =========================================================================
    // 7. IMPORT PARSERS (CONCEPTS & STUDENTS)
    // =========================================================================
    function parseConceptRowsFromText(text) {
      const rows = parseDelimitedText(text);
      if (rows.length < 2) {
        showToast('헤더와 최소 1개 이상의 개념어 행이 필요합니다.', 'warning');
        return [];
      }
      const header = rows[0].map(h => h.replace(/\s+/g, ''));
      const hasHeader = header.some(h => h.includes('과목') || h.includes('개념'));
      const dataRows = hasHeader ? rows.slice(1) : rows;
      const parsed = [];
      dataRows.forEach(r => {
        const subjectName = (r[0] || '').trim();
        const grade = parseConceptGrade(r[1], subjectName);
        const unit = (r[2] || '핵심 단원').trim();
        const term = (r[3] || '').trim();
        const definition = (r[4] || '').trim();
        const example = (r[5] || '수업 시간 예시를 참고하세요.').trim();
        const badgeName = (r[6] || ((subjectName) + " 기초역량 마스터")).trim();
        if (subjectName && term && definition) {
          parsed.push({ subjectName, grade, unit, term, definition, example, badgeName });
        }
      });
      if (parsed.length === 0) {
        showToast('유효한 개념어 행을 찾지 못했습니다. (과목명, 학년, 단원, 개념어, 정의 순서를 확인하세요)', 'error');
      }
      return parsed;
    }

    function commitConceptPreview(sourceLabel) {
      if (state.resourcePreviewRows.length === 0) return;
      if (IS_GAS) {
        const rowsToSend = state.resourcePreviewRows.slice();
        showToast('마스터 구글 스프레드시트에 개념어를 저장하는 중...', 'info');
        callGas('importConceptsServer', rowsToSend).then(res => {
          state.resourcePreviewRows = [];
          if (res && res.bootstrap) applyBootstrap(res.bootstrap);
          showToast(("총 " + ((res && res.count) || rowsToSend.length) + "개의 개념어가 마스터 스프레드시트에 저장되었습니다!"), 'success');
          renderApp();
        }).catch(err => showToast('저장 오류: ' + err.message, 'error'));
        return;
      }
      let addedCount = 0;
      state.resourcePreviewRows.forEach((row, idx) => {
        let subj = state.subjects.find(s => s.name === row.subjectName && String(s.grade) === String(row.grade));
        if (!subj) {
          subj = {
            id: 'subj-' + Date.now() + '-' + idx,
            name: row.subjectName,
            grade: row.grade,
            isIB: String(row.grade).toUpperCase() === 'IB' || isIbText(row.subjectName),
            category: getCategoryForSubject(row.subjectName, row.grade),
            badgeName: row.badgeName,
            sourceType: sourceLabel || '구글 시트 등록',
            concepts: []
          };
          state.subjects.push(subj);
        } else {
          subj.sourceType = sourceLabel || '구글 시트 업데이트';
        }
        const existingConcept = subj.concepts.find(c => c.term === row.term);
        if (existingConcept) {
          existingConcept.unit = row.unit;
          existingConcept.definition = row.definition;
          existingConcept.imageUrl = row.imageUrl;
          existingConcept.example = row.example;
        } else {
          subj.concepts.push({
            id: 'c-' + Date.now() + '-' + idx + '-' + Math.floor(Math.random() * 1000),
            unit: row.unit,
            term: row.term,
            definition: row.definition,
            imageUrl: row.imageUrl,
            svgKey: '',
            example: row.example
          });
        }
        addedCount++;
      });
      state.resourcePreviewRows = [];
      saveState();
      showToast(("총 " + (addedCount) + "개의 개념어가 온라인 리소스에 등록되었습니다!"), 'success');
      renderApp();
    }

    function parseStudentRowsFromText(text) {
      const rows = parseDelimitedText(text);
      if (rows.length < 1) {
        showToast('학생 명단 데이터가 비어 있습니다.', 'warning');
        return [];
      }
      const header = rows[0].map(h => h.replace(/\s+/g, ''));
      const hasHeader = header.some(h => h.includes('아이디') || h.includes('학번') || h.includes('이름'));
      const dataRows = hasHeader ? rows.slice(1) : rows;
      const parsed = [];
      dataRows.forEach(r => {
        const id = (r[0] || '').trim();
        const name = (r[1] || '').trim();
        const grade = parseInt(r[2], 10) || 1;
        const classNum = parseInt(r[3], 10) || 1;
        const password = (r[4] || '').trim();
        if (id && name) {
          parsed.push({ id, name, grade: Math.min(3, Math.max(1, grade)), classNum: Math.max(1, classNum), password });
        }
      });
      if (parsed.length === 0) {
        showToast('유효한 학생 행을 찾지 못했습니다. (학생아이디, 이름, 학년, 반 순서를 확인하세요)', 'error');
      }
      return parsed;
    }

      if (state.studentPreviewRows.length === 0) return;
      if (IS_GAS) {
        const rowsToSend = state.studentPreviewRows.slice();
        showToast('마스터 구글 스프레드시트에 학생 아이디를 저장하는 중...', 'info');

          renderApp();
        }).catch(err => showToast('저장 오류: ' + err.message, 'error'));

      }
      let count = 0;

    // =========================================================================
    // 8. MAIN RENDER ORCHESTRATOR & EVENT BINDING
    // =========================================================================
    function renderApp() {
      clearStudyAutoNextTimer();
      renderHeader();
      const root = document.getElementById('app-root');

      if (!state.session) {
        renderLoginView();
        refreshIcons();
        return;
      }

      if (state.session.role === 'student') {
        const stu = getCurrentStudent();
        if (!stu) {
          state.session = null;
          renderApp();
          return;
        }
        if (state.studentTab === 'subjects') {
          root.innerHTML = renderStudentSubjectsView(stu);
          bindStudentSubjectsEvents();
        } else if (state.studentTab === 'study') {
          root.innerHTML = renderStudentStudyView(stu);
          bindStudentStudyEvents(stu);
        } else if (state.studentTab === 'quiz') {
          root.innerHTML = renderStudentQuizView(stu);
          bindStudentQuizEvents(stu);
        } else if (state.studentTab === 'ranking') {
          root.innerHTML = renderStudentRankingView(stu);
          bindStudentRankingEvents();
        }
      } else {
        if (state.adminTab === 'dashboard') {
          root.innerHTML = renderTeacherDashboardView();
          bindTeacherDashboardEvents();
        } else if (state.adminTab === 'resources') {
          root.innerHTML = renderAdminResourcesView();
          bindAdminResourcesEvents();
        } else if (state.adminTab === 'students') {
          root.innerHTML = renderAdminStudentsView();
          bindAdminStudentsEvents();
        } else if (state.adminTab === 'stats') {
          root.innerHTML = renderAdminStatsView();
          bindAdminStatsEvents();
          initAdminCharts();
        }
      }
      refreshIcons();
    }

    function bindStudentQuizEvents(stu) {
      if (state.quizPhase === 'setup') {
        const sel = document.getElementById('quiz-subject-select');
        if (sel) sel.addEventListener('change', (e) => { state.activeSubjectId = e.target.value; renderApp(); });
        const typeSel = document.getElementById('quiz-type-select');
        if (typeSel) typeSel.addEventListener('change', (e) => { state.quizType = e.target.value; });
        const backBtn = document.getElementById('quiz-back-study-btn');
        if (backBtn) backBtn.addEventListener('click', () => { navigateTo('study', { subjectId: state.activeSubjectId }, true); });
        const startBtn = document.getElementById('quiz-start-btn');
        if (startBtn) startBtn.addEventListener('click', () => startQuiz(state.activeSubjectId));
      } else if (state.quizPhase === 'active') {
        const q = state.quizQuestions[state.quizCurrentIndex];
        document.querySelectorAll('[data-quiz-option]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (state.quizSubmittedCurrent) return;
            const opt = q.options[Number(btn.dataset.quizOption)];
            state.quizSelectedOption = opt;
            state.quizSubmittedCurrent = true;
            state.quizAnswers.push({ question: q, userAnswer: opt, isCorrect: opt === q.correctAnswer });
            renderApp();
          });
        });

        const shortForm = document.getElementById('quiz-short-form');
        if (shortForm) {
          shortForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (state.quizSubmittedCurrent) return;
            const inputVal = (document.getElementById('quiz-short-input').value || '').trim();
            const normalize = (s) => s.replace(/\(.*?\)/g, '').replace(/\s+/g, '').toLowerCase();
            const isCorrect = inputVal.length > 0 && (
              normalize(inputVal) === normalize(q.correctAnswer) ||
              normalize(q.correctAnswer).includes(normalize(inputVal)) && normalize(inputVal).length >= 2
            );
            state.quizSelectedOption = inputVal;
            state.quizSubmittedCurrent = true;
            state.quizAnswers.push({ question: q, userAnswer: inputVal, isCorrect });
            renderApp();
          });
        }

        const nextBtn = document.getElementById('quiz-next-btn');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (state.quizCurrentIndex + 1 < state.quizQuestions.length) {
              state.quizCurrentIndex++;
              state.quizSelectedOption = null;
              state.quizSubmittedCurrent = false;
              renderApp();
            } else {
              finalizeQuiz(stu);
            }
          });
        }
      } else if (state.quizPhase === 'result') {
        const retryBtn = document.getElementById('result-retry-btn');
        const rankBtn = document.getElementById('result-ranking-btn');
        const homeBtn = document.getElementById('result-home-btn');
        if (retryBtn) retryBtn.addEventListener('click', () => { state.quizPhase = 'setup'; renderApp(); });
        if (rankBtn) rankBtn.addEventListener('click', () => { navigateTo('ranking', { rankingGradeTab: String(stu.grade) }, true); });
        if (homeBtn) homeBtn.addEventListener('click', () => { navigateTo('subjects', {}, true); });
      }
    }

    function finalizeQuiz(stu) {
      const subj = getSubjectById(state.activeSubjectId);
      const total = state.quizAnswers.length;
      const correctCount = state.quizAnswers.filter(a => a.isCorrect).length;
      const score = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const today = new Date().toISOString().slice(0, 10);

      stu.quizHistory.push({ subjectId: subj.id, score, date: today });

      if (score >= state.settings.passThreshold) {
        const tier = score === 100 ? 'gold' : 'silver';
        const existingBadge = stu.badges.find(b => b.subjectId === subj.id);
        if (existingBadge) {
          if (score > existingBadge.score) {
            existingBadge.score = score;
            existingBadge.tier = tier;
            existingBadge.date = today;
          }
        } else {
          stu.badges.push({
            subjectId: subj.id,
            subjectName: subj.name,
            badgeName: subj.badgeName,
            score,
            tier,
            date: today
          });
        }
        if (typeof window.confetti === 'function') {
          window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
        showToast(("축하합니다! " + (subj.badgeName) + " 뱃지를 획득했습니다!"), 'success');
      }
      saveState();
      state.quizPhase = 'result';
      renderApp();
      if (IS_GAS) {
        callGas('submitQuizResultServer', stu.id, subj.name, score, subj.badgeName)
          .then(res => { if (res && res.bootstrap) { applyBootstrap(res.bootstrap); renderApp(); } })
          .catch(err => showToast('서버 기록 저장 오류: ' + err.message, 'error'));
      }
    }

          }
        });

      const exportBtn = document.getElementById('dash-export-csv-btn');
      if (exportBtn) {
        exportBtn.addEventListener('click', () => {
          const gradeFilter = state.teacherDashGradeFilter || 'all';
          const classFilter = state.teacherDashClassFilter || 'all';
          const subjectFilter = state.teacherDashSubjectFilter || 'all';
          const list = state.students.filter(s => {
            const okG = gradeFilter === 'all' || String(s.grade) === String(gradeFilter);
            const okC = classFilter === 'all' || String(s.classNum) === String(classFilter);
            return okG && okC;
          });
          let scopedSubjects = state.subjects.slice();
          if (subjectFilter === 'IB') scopedSubjects = state.subjects.filter(s => isIbSubject(s));
          else if (subjectFilter !== 'all') {
            const picked = getSubjectById(subjectFilter);
            if (picked) scopedSubjects = [picked];
          }
          const cIds = new Set();
          const sIds = new Set();
          const sNames = new Set();
          scopedSubjects.forEach(subj => {
            sIds.add(subj.id); sNames.add(subj.name);
            (subj.concepts || []).forEach(c => cIds.add(c.id));
          });
          const totalConcepts = cIds.size;
          const rows = [['학생아이디', '이름', '학년', '반', '필터범위', '암기개념어수', '범위개념어수', '암기율(%)', '보유뱃지수', '테스트응시수', '평균점수', '최근응시일']];
          const scopeText = getTeacherFilterSummary(gradeFilter, classFilter, subjectFilter);
          list.forEach(s => {
            const mem = (s.memorized || []).filter(cid => cIds.has(cid)).length;
            const pct = totalConcepts > 0 ? Math.round((mem / totalConcepts) * 100) : 0;
            const hist = (s.quizHistory || []).filter(q => subjectFilter === 'all' || sIds.has(q.subjectId) || sNames.has(q.subjectName));
            const bCnt = (s.badges || []).filter(b => subjectFilter === 'all' || sIds.has(b.subjectId) || sNames.has(b.subjectName)).length;
            const avgSc = hist.length > 0 ? Math.round(hist.reduce((a, q) => a + (Number(q.score) || 0), 0) / hist.length) : 0;
            const lastDate = hist.length > 0 ? hist.map(q => String(q.date || '')).sort().slice(-1)[0] : '';
            rows.push([s.id, s.name, s.grade, s.classNum, scopeText, mem, totalConcepts, pct, bCnt, hist.length, avgSc, lastDate]);
          });
          const safeSuffix = scopeText.replace(/[^\w가-힣-]+/g, '_');
          downloadCsvFile('대구서부고_개념마스터_' + safeSuffix + '.csv', rows);
          showToast('선택 범위 학습 현황 CSV 파일을 다운로드했습니다.', 'success');
        });
      }
    }

            callGas('updateSettingsServer', name, score).then(res => {
              if (res && res.bootstrap) applyBootstrap(res.bootstrap);
              showToast(("마스터 시트에 설정이 저장되었습니다. (합격 기준: " + (score) + "점)"), 'success');
              renderApp();
            }).catch(err => showToast('설정 저장 오류: ' + err.message, 'error'));
            return;
          }
          showToast(("설정이 저장되었습니다. (합격 기준: " + (score) + "점)"), 'success');
        });
      }
      const resetBtn = document.getElementById('reset-all-data-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          openModal('데이터 초기화', '\x3cp\x3e모든 등록 데이터와 학습 기록을 초기 샘플 상태로 되돌리시겠습니까?\x3c/p\x3e', [
            { label: '취소', className: 'px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-700' },
            {
              label: '초기화 실행',
              className: 'px-4 py-2 rounded-xl text-sm font-bold bg-rose-600 text-white',
              onClick: () => {
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                state.subjects = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
                state.students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
                state.settings.passThreshold = 80;
                showToast('초기 샘플 상태로 복원되었습니다.', 'success');
                renderApp();
              }
            }
          ]);
        });
      }
    }

    function showBootError(msg) {
      const el = document.getElementById('boot-status');
      if (el) { el.style.color = '#be123c'; el.textContent = '초기화 오류: ' + msg; }
    }
    window.addEventListener('error', (ev) => { showBootError(ev.message || '스크립트 오류'); });
    function initApp() {
      try {
        const modalCloseBtn = document.getElementById('modal-close-btn');
        if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);
        const appModal = document.getElementById('app-modal');
        if (appModal) appModal.addEventListener('click', (e) => { if (e.target.id === 'app-modal') closeModal(); });
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', () => { onLogout(); });
        const headerRefreshBtn = document.getElementById('header-refresh-btn');
        if (headerRefreshBtn) headerRefreshBtn.addEventListener('click', () => { forceHardReload(); });
        const footerRefreshBtn = document.getElementById('footer-refresh-btn');
        if (footerRefreshBtn) footerRefreshBtn.addEventListener('click', () => { forceHardReload(); });
        const logoBtn = document.getElementById('logo-home-btn');
        if (logoBtn) logoBtn.addEventListener('click', () => {
          if (!state.session) return;
          if (state.session.role === 'student') navigateTo('subjects', {}, true);
          else navigateTo('admin-dashboard', {}, true);
        });
        const mobileBtn = document.getElementById('mobile-menu-btn');
        if (mobileBtn) mobileBtn.addEventListener('click', () => { const nav = document.getElementById('mobile-nav'); if (nav) nav.classList.toggle('hidden'); });
        document.addEventListener('keydown', (e) => {
          if (!state.session || state.session.role !== 'student' || state.studentTab !== 'study' || state.studyMode !== 'flashcard') return;
          if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
          if (e.code === 'Space') { e.preventDefault(); const card = document.getElementById('flashcard-clickable'); if (card) card.click(); }
          else if (e.code === 'ArrowRight') { const next = document.getElementById('card-next-btn'); if (next) next.click(); }
          else if (e.code === 'ArrowLeft') { const prev = document.getElementById('card-prev-btn'); if (prev) prev.click(); }
        });

        window.addEventListener('scroll', () => {
          if (!state.session || state.session.role !== 'student' || state.studentTab !== 'study') return;
          if (!isMobileViewport() || !state.studyAutoCollapse || state.studyHeaderCollapsed) return;
          if (Date.now() - lastStudyHeaderExpandAt < 350) return;
          if (window.scrollY > 40) {
            setStudyHeaderCollapsedDom(true);
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          const nowMobile = isMobileViewport();
          if (nowMobile === lastViewportIsMobile) return;
          lastViewportIsMobile = nowMobile;
          if (state.session && state.session.role === 'student' && state.studentTab === 'study') {
            if (nowMobile && state.studyAutoCollapse) {
              setStudyHeaderCollapsedDom(true);
            } else if (!nowMobile) {
              setStudyHeaderCollapsedDom(false);
            }
          }
        });

        loadState();
        loadTeacherPrefs();
        loadStudyPrefs();
        const savedSession = safeSessionGet(SESSION_KEY);
        if (savedSession && (savedSession.role === 'admin' || (savedSession.role === 'student' && state.students.some(s => s.id === savedSession.studentId)))) {
          state.session = savedSession;
          if (savedSession.role === 'admin') {
            applyTeacherDefaultFilters();
          }
        }
        const savedView = safeSessionGet(LAST_VIEW_KEY);
        const defaultScreen = state.session ? (state.session.role === 'admin' ? 'admin-dashboard' : 'subjects') : 'login';
        const startScreen = state.session ? ((savedView && savedView.screen && savedView.screen !== 'login') ? savedView.screen : defaultScreen) : 'login';
        const startParams = state.session ? ((savedView && savedView.params) ? savedView.params : {}) : {};
        const wasForceRefreshed = new URLSearchParams(window.location.search).has('v');
        try {
          const cleanUrl = (window.location.protocol !== 'file:' && window.location.pathname) ? (window.location.pathname + '#' + startScreen) : ('#' + startScreen);
          history.replaceState({ screen: startScreen, params: startParams }, '', cleanUrl);
        } catch (e) {}
        renderScreen(startScreen, startParams);
        if (wasForceRefreshed) {
          showToast('최신 버전(' + APP_VERSION + ')으로 새로고침되었습니다.', 'success');
        }
        if (IS_GAS) { syncFromServer(false); }
      } catch (err) { showBootError(err && err.message ? err.message : String(err)); }
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initApp); }
    else { initApp(); }
    window.addEventListener('load', refreshIcons);
  </script>
</body>
</html>
